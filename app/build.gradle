plugins {
    id 'com.android.application'
}

android {
    namespace 'com.furina.wallpaper'
    compileSdk 36

    defaultConfig {
        applicationId "com.furina.wallpaper"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
